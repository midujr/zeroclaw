###############################################################################
# ZeroClaw — Docker Compose для Timeweb App Platform
# Образ: ghcr.io/midujr/zeroclaw-timeweb:latest
#
# Переменные задаются в панели Timeweb:
#   ZEROCLAW_API_KEY=sk-ваш-ключ
#   ZEROCLAW_PROVIDER=openrouter
#   ZEROCLAW_MODEL=anthropic/claude-sonnet-4-20250514
###############################################################################

services:
  zeroclaw:
    image: ghcr.io/midujr/zeroclaw-timeweb:latest
    ports:
      - "3000:3000"
    environment:
      - ZEROCLAW_API_KEY=${ZEROCLAW_API_KEY:-}
      - ZEROCLAW_PROVIDER=${ZEROCLAW_PROVIDER:-openrouter}
      - ZEROCLAW_MODEL=${ZEROCLAW_MODEL:-anthropic/claude-sonnet-4-20250514}
      - ZEROCLAW_TEMPERATURE=${ZEROCLAW_TEMPERATURE:-0.7}
      - ZEROCLAW_GATEWAY_PORT=3000
      - RUST_LOG=${RUST_LOG:-info,zeroclaw=debug}
      - RUST_BACKTRACE=1
      - ZEROCLAW_GATEWAY_REQUIRE_PAIRING=${ZEROCLAW_GATEWAY_REQUIRE_PAIRING:-false}
      - ZEROCLAW_GATEWAY_ALLOW_PUBLIC_BIND=${ZEROCLAW_GATEWAY_ALLOW_PUBLIC_BIND:-true}
      - ZEROCLAW_MEMORY_BACKEND=${ZEROCLAW_MEMORY_BACKEND:-sqlite}
      - ZEROCLAW_TELEGRAM_TOKEN=${ZEROCLAW_TELEGRAM_TOKEN:-}
      - ZEROCLAW_TELEGRAM_ALLOWED=${ZEROCLAW_TELEGRAM_ALLOWED:-}
      - ZEROCLAW_DISCORD_TOKEN=${ZEROCLAW_DISCORD_TOKEN:-}
      - ZEROCLAW_DISCORD_ALLOWED=${ZEROCLAW_DISCORD_ALLOWED:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "zeroclaw", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
